databaseChangeLog:
  - changeSet:
      id: 5-create-schedules
      author: darya
      changes:
        - createTable:
            tableName: schedules
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: date_start
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: date_finish
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_schedule_group
                    references: groups(id)
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_schedule_course
                    references: courses(id)
              - column:
                  name: teacher_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_schedule_teacher
                    references: teachers(id)