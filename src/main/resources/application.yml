spring:
  application:
    name: learning-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/lms_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  task:
    scheduling:
      enabled: true

app:
  schedule:
    cleanup:
      cron: "0 0 3 * * ?"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8000